name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: |
          # shellcheck is preinstalled on GitHub-hosted Ubuntu runners; install it only if it is missing
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version
          shellcheck entrypoint.sh scripts/*.sh
      - name: bash -n
        run: |
          for f in entrypoint.sh scripts/*.sh; do bash -n "$f"; done

  build:
    needs: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image name (lower case)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Build once into the local Docker and smoke-test it (the runner is amd64, so no emulation is needed).
      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: idrac6-viewer:ci
          build-args: |
            DEB_MIRROR=deb.debian.org
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --platform linux/amd64 idrac6-viewer:ci --version
          docker run --rm --platform linux/amd64 idrac6-viewer:ci --help | head -n 5
          docker run --rm --platform linux/amd64 idrac6-viewer:ci --selftest
          # without a host and without a TTY the entrypoint must refuse to start
          if docker run --rm --platform linux/amd64 idrac6-viewer:ci; then
            echo "expected a failure without IDRAC_HOST"; exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEB_MIRROR=deb.debian.org
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      # Prove that every tag really landed in the registry and that they all point to the same image.
      - name: Verify published tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          first=""
          while IFS= read -r t; do
            [ -n "$t" ] || continue
            d="$(docker buildx imagetools inspect "$t" --format '{{.Manifest.Digest}}')"
            echo "::notice title=published tag::$t -> $d"
            echo "- \`$t\` → \`$d\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -z "$first" ]; then first="$d"; elif [ "$d" != "$first" ]; then
              echo "::error::tag $t has a different digest ($d) than the first tag ($first)"; exit 1
            fi
          done <<< "$TAGS"
